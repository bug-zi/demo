<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>嘴强王者 · TALK KING</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/ui/library.css" />
    <link rel="stylesheet" href="/src/ui/arena.css" />
    <link rel="stylesheet" href="/src/ui/wall.css" />
    <script>
      // 防首帧闪错色：样式渲染前先定主题（键与 src/lib/theme.js 保持一致）
      try {
        var t = localStorage.getItem('gang-ai:theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        var sk = localStorage.getItem('gang-ai:skin');
        if (sk === 'midnight') document.documentElement.dataset.skin = sk;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          嘴强王者<span class="brand-en">TALK KING</span>
        </div>
        <div class="topbar-right">
          <span id="engine-badge" class="badge">本地引擎</span>
          <button id="skin-btn" class="ghost-btn" type="button" aria-label="皮肤选择" aria-haspopup="dialog">
            <span class="icon i-palette" aria-hidden="true"></span>
          </button>
          <button id="theme-toggle" class="ghost-btn" type="button" aria-label="切换深浅主题"></button>
          <button id="settings-btn" class="ghost-btn" type="button" aria-label="接入你的 AI">
            <span class="icon i-settings" aria-hidden="true"></span>
          </button>
          <button id="sound-toggle" class="ghost-btn" type="button" aria-pressed="false">
            <span class="icon i-volume_off" aria-hidden="true"></span><span>声音</span>
          </button>
        </div>
      </header>
      <main id="screen" class="screen" aria-live="polite"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
